server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location /swagger/ { proxy_pass http://backend:8080; }
 location = /healthz { proxy_pass http://backend:8080; }
 location = /readyz { proxy_pass http://backend:8080; }
 location / { try_files $uri $uri/ /index.html; }
}
