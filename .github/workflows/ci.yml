name: Verify booking MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_container_test_password
      JWT_SECRET: ci-only-container-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/readyz; then
              curl -fsS http://127.0.0.1:8088/
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o ./bin/backend ./src
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_STR: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
      SERVER_ADDR: 127.0.0.1:8080
      GIN_MODE: release
      RUN_LIVE: "1"
      LIVE_ADMIN_EMAIL: ci-admin@example.test
      LIVE_ADMIN_PASSWORD: ci-admin-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          cd backend
          go build -o server ./src
          ./server > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - run: |
          curl --fail -H 'Content-Type: application/json' -d '{"email":"ci-admin@example.test","password":"ci-admin-test-password"}' http://127.0.0.1:8080/api/v1/auth/register
          go run ./cmd/admin -email ci-admin@example.test
        working-directory: backend
      - run: npx playwright test tests/live.spec.ts --workers=1
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-results
          path: |
            frontend/test-results
            backend/server.log

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, container-smoke, end-to-end]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/booking-${{ matrix.component }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/booking-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
