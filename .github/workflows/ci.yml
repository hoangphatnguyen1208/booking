name: Verify booking MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o ./bin/backend ./src
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  publish-images:
    name: Build, smoke test and publish backend
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci_container_test_password
      JWT_SECRET: ci-only-container-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image once
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          platforms: linux/amd64
          tags: booking-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Start the built image with PostgreSQL
        run: |
          cat > "$RUNNER_TEMP/booking-ci.compose.yaml" <<EOF
          services:
            backend:
              image: booking-backend:$GITHUB_SHA
          EOF
          export COMPOSE_FILE="compose.yaml:$RUNNER_TEMP/booking-ci.compose.yaml"
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose up --no-build -d backend
      - name: Smoke test backend readiness
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend wget -q -O /dev/null http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push the tested image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          image="$DOCKER_USERNAME/booking-backend"
          docker tag "booking-backend:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker tag "booking-backend:$GITHUB_SHA" "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
      - name: Container logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/booking-ci.compose.yaml" ]; then docker compose logs --no-color; fi
      - name: Stop smoke test containers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/booking-ci.compose.yaml" ]; then docker compose down; fi
