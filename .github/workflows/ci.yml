name: Verify booking MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_container_test_password
      JWT_SECRET: ci-only-container-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d backend
      - run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend wget -q -O /dev/null http://127.0.0.1:8080/readyz; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o ./bin/backend ./src
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend, container-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/booking-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/booking-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
