name: Verify booking MVP
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: [backend, frontend, container-smoke, end-to-end]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/booking-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: booking-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH and deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Missing VPS_SSH_KEY}" "${KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"
          : "${VPS_HOST:?Missing VPS_HOST}" "${VPS_USER:?Missing VPS_USER}" "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          opts=(-i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${opts[@]}" -p "$port" "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/booking'
          scp "${opts[@]}" -P "$port" compose.yaml "$VPS_USER@$VPS_HOST:/opt/booking/"
          ssh "${opts[@]}" -p "$port" "$VPS_USER@$VPS_HOST" "bash -s -- '$DOCKERHUB_USERNAME/booking-backend:$GITHUB_SHA' '$DOCKERHUB_USERNAME/booking-frontend:$GITHUB_SHA'" <<'DEPLOY'
          set -euo pipefail
          cd /opt/booking
          test -s .env || { echo 'Create /opt/booking/.env with POSTGRES_PASSWORD and JWT_SECRET first'; exit 1; }
          export BACKEND_IMAGE="$1" FRONTEND_IMAGE="$2"
          cat > compose.images.yaml <<'IMAGES'
          services:
            backend:
              image: ${BACKEND_IMAGE:?}
            frontend:
              image: ${FRONTEND_IMAGE:?}
          IMAGES
          compose=(docker compose -p booking -f compose.yaml -f compose.images.yaml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --no-build --remove-orphans
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/readyz && curl -fsS -o /dev/null http://127.0.0.1:8088/; then
              printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > .release.env.tmp
              mv .release.env.tmp .release.env
              echo 'Deployment ready'
              exit 0
            fi
            sleep 3
          done
          "${compose[@]}" ps
          echo 'Deployment failed readiness; inspect container logs on the VPS'
          exit 1
          DEPLOY

  container-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci_container_test_password
      JWT_SECRET: ci-only-container-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/readyz; then
              curl -fsS http://127.0.0.1:8088/
              exit 0
            fi
            sleep 3
          done
          exit 1
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down
        if: always()
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o ./bin/backend ./src
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: booking_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking_test -d booking_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_STR: host=localhost port=5432 user=booking_test password=test_password dbname=booking_test sslmode=disable
      JWT_SECRET: ci-only-test-secret-at-least-32-characters
      SERVER_ADDR: 127.0.0.1:8080
      GIN_MODE: release
      RUN_LIVE: "1"
      LIVE_ADMIN_EMAIL: ci-admin@example.test
      LIVE_ADMIN_PASSWORD: ci-admin-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          cd backend
          go build -o server ./src
          ./server > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - run: |
          curl --fail -H 'Content-Type: application/json' -d '{"email":"ci-admin@example.test","password":"ci-admin-test-password"}' http://127.0.0.1:8080/api/v1/auth/register
          go run ./cmd/admin -email ci-admin@example.test
        working-directory: backend
      - run: npx playwright test tests/live.spec.ts --workers=1
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-results
          path: |
            frontend/test-results
            backend/server.log
