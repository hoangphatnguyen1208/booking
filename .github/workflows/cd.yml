name: Deploy booking
on:
  workflow_run:
    workflows: ["Verify booking MVP"]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: booking-cd-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -eu
            cd booking
            docker compose pull backend
            docker compose up -d --no-build backend
            docker image prune -f
