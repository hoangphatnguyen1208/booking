name: Deploy booking
on:
  workflow_run:
    workflows: ["Verify booking MVP"]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: booking-cd-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH (pull images)
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_FINGERPRINT }}
          envs: RELEASE_SHA,DOCKER_USERNAME
          command_timeout: 10m
          script: |
            set -eu
            cd booking
            test -s .env || { echo 'Configure .env with POSTGRES_PASSWORD and JWT_SECRET first'; exit 1; }
            test -n "$DOCKER_USERNAME"
            git fetch origin master
            git checkout --detach "$RELEASE_SHA"
            export BACKEND_IMAGE="$DOCKER_USERNAME/booking-backend:$RELEASE_SHA"
            export FRONTEND_IMAGE="$DOCKER_USERNAME/booking-frontend:$RELEASE_SHA"
            cat > compose.images.yaml <<'IMAGES'
            services:
              backend:
                image: ${BACKEND_IMAGE:?}
              frontend:
                image: ${FRONTEND_IMAGE:?}
            IMAGES
            docker compose -p booking -f compose.yaml -f compose.images.yaml config --quiet
            docker compose -p booking -f compose.yaml -f compose.images.yaml pull
            docker compose -p booking -f compose.yaml -f compose.images.yaml up -d --no-build --remove-orphans
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:8088/readyz && curl -fsS -o /dev/null http://127.0.0.1:8088/; then
                printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > .release.env.tmp
                mv .release.env.tmp .release.env
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            docker compose -p booking -f compose.yaml -f compose.images.yaml ps
            echo 'Deployment failed readiness; inspect container logs on the VPS'
            exit 1
