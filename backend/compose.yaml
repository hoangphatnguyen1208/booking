name: booking

services:
  backend:
    container_name: booking-backend
    image: ${BACKEND_IMAGE:-hoangphat120805/booking-backend:latest}
    environment:
      DB_STR: ${DB_STR}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME:-3600}
      SERVER_ADDR: ":8080"
      GIN_MODE: release
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
