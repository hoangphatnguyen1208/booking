basePath: /api/v1
definitions:
  hotel.CreateRequest:
    properties:
      address:
        maxLength: 255
        type: string
      amenities:
        items:
          type: string
        maxItems: 20
        type: array
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      image_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 100
        type: string
      rank:
        maximum: 5
        type: integer
      slug:
        maxLength: 100
        type: string
    required:
    - city
    - country
    - name
    - slug
    type: object
  hotel.Hotel:
    properties:
      address:
        type: string
      amenities:
        items:
          type: string
        type: array
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      rank:
        type: integer
      slug:
        type: string
      updated_at:
        type: string
    type: object
  hotel.ListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/hotel.Hotel'
        type: array
      limit:
        type: integer
      page:
        type: integer
    type: object
  hotel.UpdateRequest:
    properties:
      address:
        maxLength: 255
        type: string
      amenities:
        items:
          type: string
        maxItems: 20
        type: array
      city:
        maxLength: 100
        type: string
      country:
        maxLength: 100
        type: string
      image_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 100
        type: string
      rank:
        maximum: 5
        type: integer
      slug:
        maxLength: 100
        type: string
    required:
    - city
    - country
    - name
    - slug
    type: object
  identity.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  identity.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  identity.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  identity.OAuthErrorResponse:
    properties:
      error:
        type: string
      error_description:
        type: string
    type: object
  identity.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  identity.Role:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  identity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      roles:
        items:
          $ref: '#/definitions/identity.Role'
        type: array
      updated_at:
        type: string
    type: object
  lodging.AdminInput:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  lodging.AvailableRoom:
    properties:
      available:
        type: integer
      currency:
        type: string
      nights:
        items:
          $ref: '#/definitions/lodging.Inventory'
        type: array
      room:
        $ref: '#/definitions/lodging.RoomType'
      total:
        type: integer
    type: object
  lodging.Booking:
    properties:
      cancel_before:
        type: string
      check_in:
        type: string
      check_out:
        type: string
      created_at:
        type: string
      currency:
        type: string
      guest_name:
        type: string
      guests:
        type: integer
      hotel_id:
        type: string
      hotel_name:
        type: string
      id:
        type: string
      nights:
        items:
          $ref: '#/definitions/lodging.BookingNight'
        type: array
      payment_status:
        type: string
      phone:
        type: string
      room_image_url:
        type: string
      room_name:
        type: string
      room_type_id:
        type: string
      rooms:
        type: integer
      status:
        type: string
      total:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  lodging.BookingInput:
    properties:
      check_in:
        type: string
      check_out:
        type: string
      expected_total:
        minimum: 0
        type: integer
      guest_name:
        maxLength: 100
        type: string
      guests:
        maximum: 2000
        minimum: 1
        type: integer
      phone:
        maxLength: 30
        type: string
      room_type_id:
        type: string
      rooms:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - check_in
    - check_out
    - guest_name
    - guests
    - phone
    - room_type_id
    - rooms
    type: object
  lodging.BookingNight:
    properties:
      date:
        type: string
      price:
        type: integer
      rooms:
        type: integer
    type: object
  lodging.Inventory:
    properties:
      capacity:
        type: integer
      date:
        type: string
      price:
        type: integer
      reserved:
        type: integer
      room_type_id:
        type: string
    type: object
  lodging.InventoryInput:
    properties:
      capacity:
        maximum: 10000
        minimum: 0
        type: integer
      from:
        type: string
      price:
        maximum: 1000000000000
        minimum: 0
        type: integer
      to:
        type: string
    required:
    - from
    - to
    type: object
  lodging.MemberInput:
    properties:
      email:
        type: string
      role:
        enum:
        - owner
        - manager
        - staff
        - remove
        type: string
    required:
    - email
    - role
    type: object
  lodging.MemberRow:
    properties:
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  lodging.RoomInput:
    properties:
      active:
        type: boolean
      capacity:
        maximum: 20
        minimum: 1
        type: integer
      image_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 100
        type: string
      total_rooms:
        maximum: 10000
        minimum: 1
        type: integer
    required:
    - capacity
    - name
    - total_rooms
    type: object
  lodging.RoomType:
    properties:
      active:
        type: boolean
      capacity:
        type: integer
      created_at:
        type: string
      hotel_id:
        type: string
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      total_rooms:
        type: integer
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Hotel booking API.
  title: Booking API
  version: "1.0"
paths:
  /admin/audit-logs:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: List recent audit events
      tags:
      - Admin
  /admin/users:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/identity.User'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: List users and roles
      tags:
      - Admin
  /admin/users/{id}/admin:
    put:
      consumes:
      - application/json
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      - description: Request fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lodging.AdminInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Grant or revoke system admin
      tags:
      - Admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/identity.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
      summary: Sign in and receive a JWT
      tags:
      - Auth
  /auth/me:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
      security:
      - OAuth2Password: []
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/identity.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/identity.ErrorResponse'
      summary: Register an account
      tags:
      - Auth
  /auth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: Grant type
        enum:
        - password
        in: formData
        name: grant_type
        required: true
        type: string
      - description: Account email
        in: formData
        name: username
        required: true
        type: string
      - description: Password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/identity.OAuthErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/identity.OAuthErrorResponse'
      summary: Get a token using the standard Swagger login form
      tags:
      - Auth
  /bookings:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.Booking'
            type: array
      security:
      - OAuth2Password: []
      summary: List my bookings
      tags:
      - Bookings
    post:
      consumes:
      - application/json
      parameters:
      - description: 8-100 characters, unique per attempt
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Guest details and expected total
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lodging.BookingInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/lodging.Booking'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Create or replay a booking
      tags:
      - Bookings
  /bookings/{id}:
    get:
      parameters:
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lodging.Booking'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Get booking detail
      tags:
      - Bookings
  /bookings/{id}/cancel:
    post:
      parameters:
      - description: Booking UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/lodging.Booking'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Cancel booking
      tags:
      - Bookings
  /bookings/{id}/complete:
    post:
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Complete stay and acknowledge cash payment
      tags:
      - Management
  /hotels:
    get:
      parameters:
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size, maximum 100
        in: query
        name: limit
        type: integer
      - description: Hotel name, city or country
        in: query
        name: destination
        type: string
      - description: Star rank
        in: query
        name: rank
        type: integer
      - description: YYYY-MM-DD
        in: query
        name: check_in
        type: string
      - description: YYYY-MM-DD
        in: query
        name: check_out
        type: string
      - default: 1
        description: Number of rooms
        in: query
        name: rooms
        type: integer
      - default: 2
        description: Number of guests
        in: query
        name: guests
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotel.ListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List hotels
      tags:
      - Hotels
    post:
      consumes:
      - application/json
      parameters:
      - description: Hotel details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hotel.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/hotel.Hotel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Create hotel
      tags:
      - Hotels
  /hotels/{id}:
    delete:
      parameters:
      - description: Hotel UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Delete hotel
      tags:
      - Hotels
    get:
      parameters:
      - description: Hotel UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotel.Hotel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get hotel
      tags:
      - Hotels
    put:
      consumes:
      - application/json
      parameters:
      - description: Hotel UUID
        in: path
        name: id
        required: true
        type: string
      - description: Complete hotel details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/hotel.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/hotel.Hotel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Replace all editable hotel fields
      tags:
      - Hotels
  /hotels/{id}/availability:
    get:
      parameters:
      - description: Hotel UUID
        in: path
        name: id
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: check_in
        required: true
        type: string
      - description: YYYY-MM-DD
        in: query
        name: check_out
        required: true
        type: string
      - default: 1
        description: Rooms
        in: query
        name: rooms
        type: integer
      - default: 2
        description: Guests
        in: query
        name: guests
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.AvailableRoom'
            type: array
      summary: Find available room types and total VND price
      tags:
      - Rooms
  /hotels/{id}/bookings:
    get:
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.Booking'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: List hotel bookings
      tags:
      - Management
  /hotels/{id}/manage-rooms:
    get:
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.RoomType'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: List room types including inactive rooms
      tags:
      - Management
  /hotels/{id}/members:
    get:
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.MemberRow'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: List hotel members
      tags:
      - Management
    put:
      consumes:
      - application/json
      parameters:
      - description: Resource UUID
        in: path
        name: id
        required: true
        type: string
      - description: Request fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lodging.MemberInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - OAuth2Password: []
      summary: Set or remove hotel membership
      tags:
      - Management
  /hotels/{id}/room-types:
    get:
      parameters:
      - description: Hotel UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/lodging.RoomType'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List active room types
      tags:
      - Rooms
    post:
      consumes:
      - application/json
      parameters:
      - description: Hotel UUID for POST, room UUID for PUT
        in: path
        name: id
        required: true
        type: string
      - description: Room fields
