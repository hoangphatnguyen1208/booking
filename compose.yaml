services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - booking_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_STR: "host=db port=5432 user=booking password=${POSTGRES_PASSWORD} dbname=booking sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_TIME: 3600
      SERVER_ADDR: ":8080"
      GIN_MODE: release
      TRUSTED_PROXIES: "172.16.0.0/12"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:3000"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  booking_data:
